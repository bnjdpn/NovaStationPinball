name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - "marketing/**"
      - "scripts/marketing_site.rb"
      - "fastlane/metadata/**"
      - "NovaStationPinball/Resources/Assets.xcassets/AppIcon.appiconset/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketing-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate generated site
        run: ruby scripts/marketing_site.rb --check
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Stage public files only
        run: |
          mkdir -p _site
          rsync -a --delete --exclude DIRECTION.md site/ _site/
          test ! -e _site/DIRECTION.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
