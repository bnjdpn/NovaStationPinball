name: NovaStationPinball
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  NovaStationCore:
    path: .
targets:
  NovaStationPinball:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovaStationPinball
        excludes:
          - StoreKit
    dependencies:
      - package: NovaStationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bnjdpn.NovaStationPinball
        PRODUCT_NAME: Nova Station Pinball
        PRODUCT_MODULE_NAME: NovaStationPinball
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: NovaStationPinball/NovaStationPinball.entitlements
    info:
      path: NovaStationPinball/Info.plist
      properties:
        CFBundleDisplayName: Nova Station Pinball
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
  NovaStationPinballTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovaStationPinballTests
    dependencies:
      - target: NovaStationPinball
      - package: NovaStationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bnjdpn.NovaStationPinballTests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nova Station Pinball.app/Nova Station Pinball"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NovaStationPinballUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovaStationPinballUITests
    dependencies:
      - target: NovaStationPinball
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bnjdpn.NovaStationPinballUITests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NovaStationPinball:
    build:
      targets:
        NovaStationPinball: all
        NovaStationPinballTests: [test]
        NovaStationPinballUITests: [test]
    test:
      targets:
        - NovaStationPinballTests
        - NovaStationPinballUITests
    run:
      storeKitConfiguration: NovaStationPinball/StoreKit/NovaStationPinball.storekit
